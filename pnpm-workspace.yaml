packages:
  - apps/*
  - packages/*

# Pacotes autorizados a rodar scripts de instalação (o pnpm bloqueia os
# demais por segurança). Cada um foi conferido antes de entrar aqui.
allowBuilds:
  # Recria atalhos internos dos arquivos do PostgreSQL.
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/darwin-arm64': true
  # Confere o programa do esbuild (usado pelo tsx para rodar scripts TypeScript).
  esbuild: true
  # Prisma: confere a versão do Node e baixa o motor que aplica as migrations.
  prisma: true
  '@prisma/engines': true
  # Vem junto com o @nestjs/cli, mas não usamos (a API compila com o tsc).
  '@swc/core': false

# Versões forçadas para corrigir falhas de segurança em dependências indiretas.
minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - next@16.4.3

overrides:
  # O @nestjs/platform-express ainda traz o multer 2.4.0, que tem falha conhecida.
  multer: 2.5.0
